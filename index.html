<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Birbank Prototype</title>
<meta name="theme-color" content="#f7f6f6">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Birbank">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; background: #f7f6f6; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #151414; -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
  body { display: flex; align-items: center; justify-content: center; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  .lock { width: 100%; max-width: 320px; display: flex; flex-direction: column; align-items: center; gap: 28px; }
  .logo { width: 72px; height: 72px; border-radius: 18px; display: block; box-shadow: 0 10px 30px rgba(237,30,64,0.25); }
  h1 { margin: 0; font-size: 22px; line-height: 28px; font-weight: 700; text-align: center; }
  .sub { margin: -20px 0 0; font-size: 15px; line-height: 20px; color: rgba(21,20,20,0.55); text-align: center; }
  .dots { display: flex; gap: 16px; height: 16px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px rgba(21,20,20,0.35); transition: background-color 120ms ease, box-shadow 120ms ease, transform 120ms ease; }
  .dot.on { background: #151414; box-shadow: none; transform: scale(1.05); }
  .dots.bad { animation: shake 420ms cubic-bezier(.36,.07,.19,.97); }
  .dots.bad .dot.on { background: #ed1e40; }
  @keyframes shake { 10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)} 30%,50%,70%{transform:translateX(-8px)} 40%,60%{transform:translateX(8px)} }
  .pad { display: grid; grid-template-columns: repeat(3, 76px); gap: 16px 24px; }
  .key { width: 76px; height: 76px; border-radius: 50%; border: 0; background: rgba(21,20,20,0.06); color: inherit; font: 500 30px/1 -apple-system, 'SF Pro Display', system-ui, sans-serif; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; transition: background-color 120ms ease, transform 120ms ease; }
  .key:active { background: rgba(21,20,20,0.16); transform: scale(0.96); }
  .key:focus-visible { outline: 2px solid #ed1e40; outline-offset: 3px; }
  .key.ghost { background: transparent; font-size: 16px; font-weight: 500; }
  .status { min-height: 20px; font-size: 14px; line-height: 20px; color: rgba(21,20,20,0.55); text-align: center; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  @media (max-height: 640px) { .lock { gap: 18px; } .key { width: 64px; height: 64px; font-size: 26px; } .pad { grid-template-columns: repeat(3, 64px); gap: 12px 22px; } .logo { width: 56px; height: 56px; } }
  @media (prefers-reduced-motion: reduce) { .dots.bad { animation: none; } }
</style>
</head>
<body>
<main class="lock" id="lock">
  <img class="logo" src="icon-192.png" alt="">
  <h1>Birbank Prototype</h1>
  <p class="sub">Enter the access code</p>
  <label class="sr" for="pin">Access code</label>
  <input class="sr" id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="4">
  <div class="dots" id="dots" aria-hidden="true"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <div class="pad" id="pad">
    <button class="key" type="button">1</button><button class="key" type="button">2</button><button class="key" type="button">3</button>
    <button class="key" type="button">4</button><button class="key" type="button">5</button><button class="key" type="button">6</button>
    <button class="key" type="button">7</button><button class="key" type="button">8</button><button class="key" type="button">9</button>
    <span></span><button class="key" type="button">0</button><button class="key ghost" type="button" data-del aria-label="Delete">Delete</button>
  </div>
  <div class="status" id="status" role="status" aria-live="polite"></div>
</main>
<script>
(function () {
  'use strict';
  var ITER = 250000, PIN_LEN = 4, KEY = 'bb-proto-pin';
  var pin = '', busy = false;
  var dots = document.querySelectorAll('.dot'), dotsBox = document.getElementById('dots');
  var statusEl = document.getElementById('status'), input = document.getElementById('pin');

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});

  function paint() { for (var i = 0; i < dots.length; i++) dots[i].classList.toggle('on', i < pin.length); }
  function press(d) {
    if (busy) return;
    if (d === 'del') pin = pin.slice(0, -1); else if (pin.length < PIN_LEN) pin += d;
    paint();
    if (pin.length === PIN_LEN) unlock(pin, true);
  }
  document.getElementById('pad').addEventListener('click', function (e) {
    var b = e.target.closest('.key'); if (!b) return;
    press(b.hasAttribute('data-del') ? 'del' : b.textContent.trim());
  });
  document.addEventListener('keydown', function (e) {
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === 'Backspace') press('del');
  });

  function b64ToBytes(s) { var bin = atob(s), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }

  async function decrypt(code) {
    var buf = new Uint8Array(await (await fetch('bundle.bin', { cache: 'no-cache' })).arrayBuffer());
    var salt = buf.slice(0, 16), iv = buf.slice(16, 28), ct = buf.slice(28);
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: ITER, hash: 'SHA-256' }, base,
      { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
    return JSON.parse(new TextDecoder().decode(plain));
  }

  // Head injected into the app document: PWA tags + fit-to-screen layer.
  var HEAD = [
    '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">',
    '<meta name="theme-color" content="#f7f6f6">',
    '<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">',
    '<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Birbank">',
    '<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">',
    '<style id="pwa-fit">',
    'html,body{margin:0;height:100%;overflow:hidden;background:#e7e5ec;overscroll-behavior:none;-webkit-text-size-adjust:100%}',
    'html.is-phone,html.is-phone body{background:#f7f6f6}',
    'html.is-app,html.is-app body{height:100vh}',
    '#dc-root{position:fixed;left:50%;top:var(--appTop,0px);width:390px;height:var(--appH,844px);transform:translateX(-50%) scale(var(--appS,1));transform-origin:50% 0;touch-action:pan-x pan-y}',
    '.is-desk #dc-root{border-radius:55px;box-shadow:0 30px 90px rgba(30,20,40,.22),0 0 0 10px #151414}',
    // On a phone the mock status bar collapses to the real status-bar inset (0 on Android, where the system bar sits outside the viewport).
    '.is-phone .sb-row{height:var(--sbH,0px)!important;min-height:0!important;visibility:hidden;overflow:hidden}.is-phone .th-homeind{display:none}',
    '.pw-avatar{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;transition:transform 3s ease}.pw-avatar.pw-hold{transform:scale(.8)}',
    '</style>',
    '<script>(function(){var r=document.documentElement;function fit(){var vv=window.visualViewport,w=vv?vv.width:innerWidth,h=vv?vv.height:innerHeight;',
    'var app=navigator.standalone===true||matchMedia("(display-mode: standalone)").matches;r.classList.toggle("is-app",app);',
    'var pr=document.createElement("div");pr.style.cssText="position:fixed;top:0;left:0;width:0;height:100vh;visibility:hidden;padding-top:env(safe-area-inset-top,0px);box-sizing:content-box";r.appendChild(pr);',
    'var inset=parseFloat(getComputedStyle(pr).paddingTop)||0,vh=pr.offsetHeight-inset;if(r.dataset.inset!=null)inset=+r.dataset.inset;',
    // iOS home-screen app: the viewport covers the whole screen, but innerHeight can come up short by the status bar.
    'if(app){h=Math.max(h,vh,innerHeight);if(navigator.standalone===true&&screen.height>screen.width&&Math.abs(w-screen.width)<2)h=Math.max(h,screen.height);}',
    'r.removeChild(pr);',
    'var phone=w<=560;',
    'if(phone){var s=w/390;r.classList.add("is-phone");r.classList.remove("is-desk");',
    'r.style.setProperty("--appS",s);r.style.setProperty("--appH",(h/s)+"px");r.style.setProperty("--appR","0px");r.style.setProperty("--appTop","0px");r.style.setProperty("--sbH",(inset/s)+"px");}',
    'else{var s2=Math.min(1.15,(h-64)/844,(w-48)/390);r.classList.add("is-desk");r.classList.remove("is-phone");',
    'r.style.setProperty("--appS",s2);r.style.setProperty("--appH","844px");r.style.setProperty("--appR","55px");r.style.setProperty("--appTop",((h-844*s2)/2)+"px");}}',
    'fit();addEventListener("resize",fit);addEventListener("orientationchange",function(){setTimeout(fit,250)});if(window.visualViewport)visualViewport.addEventListener("resize",fit);',
    'document.addEventListener("gesturestart",function(e){e.preventDefault()});',
    // Hold the avatar for 3 s to drop the offline cache and reload the latest build.
    'var hold=null,hx=0,hy=0,hel=null;function stop(){if(hold){clearTimeout(hold);hold=null;}if(hel){hel.classList.remove("pw-hold");hel=null;}}',
    'function reload(){try{navigator.vibrate&&navigator.vibrate(40);}catch(_){}',
    'var p=[];try{if(window.caches)p.push(caches.keys().then(function(k){return Promise.all(k.map(function(n){return caches.delete(n)}))}));}catch(_){}',
    'try{if(navigator.serviceWorker)p.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(x){return x.unregister()}))}));}catch(_){}',
    'Promise.all(p).catch(function(){}).then(function(){location.reload()});}',
    'document.addEventListener("pointerdown",function(e){var a=e.target.closest&&e.target.closest(".pw-avatar");if(!a)return;stop();hel=a;hx=e.clientX;hy=e.clientY;a.classList.add("pw-hold");hold=setTimeout(function(){hold=null;reload();},3000);},true);',
    'document.addEventListener("pointermove",function(e){if(hold&&(Math.abs(e.clientX-hx)>12||Math.abs(e.clientY-hy)>12))stop();},true);',
    '["pointerup","pointercancel","touchend","touchcancel"].forEach(function(t){document.addEventListener(t,stop,true);});',
    'document.addEventListener("scroll",function(e){var t=e.target;if(hel&&(t===document||(t.contains&&t.contains(hel))))stop();},true);',
    'document.addEventListener("contextmenu",function(e){if(e.target.closest&&e.target.closest(".pw-avatar"))e.preventDefault();},true);',
    '})();<\/script>'
  ].join('\n');

  async function unlock(code, typed) {
    busy = true; statusEl.textContent = 'Unlocking…';
    var data;
    try { data = await decrypt(code); }
    catch (e) {
      busy = false; pin = ''; statusEl.textContent = typed ? 'Wrong code — try again' : '';
      try { localStorage.removeItem(KEY); } catch (_) {}
      if (typed) { dotsBox.classList.remove('bad'); void dotsBox.offsetWidth; dotsBox.classList.add('bad'); setTimeout(function () { dotsBox.classList.remove('bad'); paint(); }, 450); }
      else paint();
      return;
    }
    try { localStorage.setItem(KEY, code); } catch (_) {}
    // Images become blob: URLs, the Bir screen is served to the runtime from memory.
    var main = data.main, bir = data.bir;
    Object.keys(data.blobs).forEach(function (id) {
      var b = data.blobs[id], url = URL.createObjectURL(new Blob([b64ToBytes(b.d)], { type: b.t }));
      var re = new RegExp('/_blob/' + id, 'g'); main = main.replace(re, url); bir = bir.replace(re, url);
    });
    var birBlob = new Blob([bir], { type: 'text/html' }), birUrl = URL.createObjectURL(birBlob);
    window.__resources = { './Bir.dc.html': birUrl };
    window.__resourceBlobs = {}; window.__resourceBlobs[birUrl] = birBlob;
    main = main.replace('<script src="./support.js"><\/script>', '<script src="./dc-runtime.js"><\/script>')
               .replace('</head>', HEAD + '\n</head>');
    document.open(); document.write(main); document.close();
  }

  var saved = null; try { saved = localStorage.getItem(KEY); } catch (_) {}
  if (saved) unlock(saved, false);
  input.addEventListener('input', function () { pin = input.value.replace(/\D/g, '').slice(0, PIN_LEN); paint(); if (pin.length === PIN_LEN) unlock(pin, true); });
})();
</script>
</body>
</html>
